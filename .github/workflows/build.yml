name: build

# Builds StudyApp's Windows installer from the private JamesKLadd/studyapp repo and publishes it here, where the app's
# updater looks (releases/latest/download/latest.json). It runs in this public repo because public repos get GitHub
# Actions minutes for free. The source is fetched read-only with SOURCE_TOKEN and never committed here.
#
# Only a schedule and manual runs start it (never pull requests), so the secrets are only ever used by this repo's
# own workflow. Secrets: SOURCE_TOKEN (fine-grained, Contents: read on studyapp), TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the update signing key).
on:
  schedule:
    - cron: "*/15 * * * *"   # picks up new commits on studyapp's main
  workflow_dispatch:
    inputs:
      ref:
        description: studyapp branch or commit to build
        default: main
      force:
        description: build even if nothing in the app changed
        type: boolean
        default: false

permissions:
  contents: write   # publish releases in this repo

concurrency:
  group: build
  cancel-in-progress: false

env:
  SOURCE_REPO: JamesKLadd/studyapp
  # Compiled into the app for share links (studyapp docs/SHARING.md).
  STUDYAPP_SHARE_URL: https://studyapp-share.doctorpuppy05.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      sha: ${{ steps.c.outputs.sha }}
      version: ${{ steps.c.outputs.version }}
      title: ${{ steps.c.outputs.title }}
    steps:
      - id: c
        env:
          T: ${{ secrets.SOURCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
          FORCE: ${{ inputs.force || false }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$T" ]; then echo "::notice::Add the SOURCE_TOKEN secret first."; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          api="https://api.github.com/repos/$SOURCE_REPO"
          commit=$(curl -fsS -H "Authorization: Bearer $T" "$api/commits/$REF")
          sha=$(jq -r .sha <<<"$commit")
          title=$(jq -r '.commit.message' <<<"$commit" | head -1)
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,body 2>/dev/null || echo '{}')
          tag=$(jq -r '.tagName // "v0.2.0"' <<<"$latest")
          last=$(jq -r '.body // ""' <<<"$latest" | grep -o 'studyapp@[0-9a-f]\{40\}' | head -1 | cut -d@ -f2 || true)
          build=false
          if [ "$EVENT" = workflow_dispatch ] && [ "$FORCE" = true ]; then build=true
          elif [ "$sha" = "$last" ]; then build=false
          elif [ -z "$last" ]; then build=true
          else
            # (if the last built commit is gone, e.g. history was rewritten, build anyway)
            files=$(curl -fsS -H "Authorization: Bearer $T" "$api/compare/$last...$sha" | jq -r '.files[].filename' || echo engine/)
            grep -qE '^(engine/|apps/desktop/)' <<<"$files" && build=true
          fi
          IFS=. read -r major minor patch <<<"${tag#v}"
          version="$major.$minor.$((patch + 1))"
          echo "Latest release $tag (from ${last:-unknown}); $SOURCE_REPO@$sha: build=$build -> $version"
          { echo "build=$build"; echo "sha=$sha"; echo "version=$version"; echo "title=$title"; } >> "$GITHUB_OUTPUT"

  engine-tests:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt pytest httpx
      - run: python -m pytest -q -p no:cacheprovider engine/tests

  windows-installer:
    needs: [check, engine-tests]
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Engine tests (Windows)
        run: |
          pip install -r engine/requirements.txt pytest httpx pyinstaller
          python -m pytest -q -p no:cacheprovider engine/tests

      - name: Build engine executable
        run: python engine/build_engine.py

      - name: Smoke-test engine executable
        run: |
          $env:STUDYAPP_TOKEN = "ci"
          $env:STUDYAPP_DATA = "$env:RUNNER_TEMP\studyapp-data"
          $p = Start-Process apps/desktop/src-tauri/engine-dist/studyapp-engine.exe -RedirectStandardOutput "$env:RUNNER_TEMP\engine.out" -RedirectStandardError "$env:RUNNER_TEMP\engine.err" -PassThru -NoNewWindow
          $port = $null
          for ($i = 0; $i -lt 120 -and -not $port; $i++) {
            Start-Sleep -Milliseconds 500
            $line = Get-Content "$env:RUNNER_TEMP\engine.out" -ErrorAction SilentlyContinue | Select-String "STUDYAPP_ENGINE_READY port=(\d+)"
            if ($line) { $port = $line.Matches[0].Groups[1].Value }
          }
          if (-not $port) { Get-Content "$env:RUNNER_TEMP\engine.err"; throw "engine did not start" }
          $h = @{ "X-Engine-Token" = "ci" }
          Invoke-RestMethod "http://127.0.0.1:$port/health" | Out-Null
          $m = Invoke-RestMethod "http://127.0.0.1:$port/models" -Headers $h
          if (-not ($m.components | Where-Object id -eq "runtime")) { throw "no Windows runtime in the model catalog" }
          Stop-Process -Id $p.Id

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Set version
        working-directory: apps/desktop/src-tauri
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('tauri.conf.json','utf8'));c.version=process.env.APP_VERSION;fs.writeFileSync('tauri.conf.json',JSON.stringify(c,null,2))"

      - name: Build signed installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Add the TAURI_SIGNING_PRIVATE_KEY secret: without it the app won't accept the update." }
          npm ci
          npm test
          '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content updater.conf.json -Encoding utf8
          npx tauri build --config updater.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.check.outputs.title }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          $dir = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$dir/*-setup.exe" | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $tag = "v$env:APP_VERSION"
          $latest = [ordered]@{
            version = $env:APP_VERSION
            notes = $env:TITLE
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{
              signature = $sig.Trim()
              url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($exe.Name)"
            } }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          $notes = "$env:TITLE`n`nBuilt from studyapp@$env:SHA"
          gh release create $tag $exe.FullName latest.json --repo $env:GITHUB_REPOSITORY --title "StudyApp $env:APP_VERSION" --notes "$notes" --latest
